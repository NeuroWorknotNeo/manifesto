# Файл создан командой «python3 tools/build.py issue-form» из config.toml и
# options.toml. Не правьте его руками: поправьте исходники и выполните команду.
name: Подписать манифест
description: Поставить подпись под манифестом «Искусственный интеллект — каждому студенту МГУ»
title: Подпись
labels: ["подпись"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что поддерживаете предложение! Текст манифеста и список подписей: https://neuroworknotneo.github.io/msu-ai-manifesto/

        **Всё, что вы введёте в этой форме, будет опубликовано** — в этой заявке, в списке подписей на сайте и в PDF. Подробнее: [согласие на публикацию подписи](https://neuroworknotneo.github.io/msu-ai-manifesto/consent.html).

        Подпись добавится автоматически через пару минут: робот ответит в этой заявке и закроет её. С одной учётной записи GitHub можно подписать один раз.
  - type: input
    id: name
    attributes:
      label: "Имя и фамилия"
      description: "Так подпись будет выглядеть в списке. Кириллицей или латиницей; можно сокращённо — «Иван И.»."
      placeholder: Иван Иванов
    validations:
      required: true
  - type: dropdown
    id: faculty
    attributes:
      label: "Факультет"
      options:
        - "Механико-математический факультет"
        - "Факультет вычислительной математики и кибернетики"
        - "Физический факультет"
        - "Химический факультет"
        - "Факультет наук о материалах"
        - "Факультет фундаментальной физико-химической инженерии"
        - "Факультет космических исследований"
        - "Факультет искусственного интеллекта"
        - "Биологический факультет"
        - "Факультет биоинженерии и биоинформатики"
        - "Биотехнологический факультет"
        - "Факультет фундаментальной медицины"
        - "Факультет почвоведения"
        - "Геологический факультет"
        - "Географический факультет"
        - "Исторический факультет"
        - "Филологический факультет"
        - "Философский факультет"
        - "Экономический факультет"
        - "Юридический факультет"
        - "Факультет журналистики"
        - "Факультет психологии"
        - "Социологический факультет"
        - "Факультет политологии"
        - "Факультет мировой политики"
        - "Факультет глобальных процессов"
        - "Факультет государственного управления"
        - "Институт стран Азии и Африки"
        - "Факультет иностранных языков и регионоведения"
        - "Факультет педагогического образования"
        - "Факультет искусств"
        - "Высшая школа бизнеса"
        - "Московская школа экономики"
        - "Высшая школа управления и инноваций"
        - "Высшая школа государственного аудита"
        - "Высшая школа государственного администрирования"
        - "Высшая школа культурной политики и управления в гуманитарной сфере"
        - "Высшая школа перевода"
        - "Высшая школа современных социальных наук"
        - "Высшая школа телевидения"
        - "Другое подразделение или филиал МГУ"
    validations:
      required: true
  - type: input
    id: faculty_other
    attributes:
      label: "Другое подразделение"
      description: "Заполните, только если выбрали «Другое подразделение или филиал МГУ»."
      placeholder: Например, филиал МГУ в Севастополе
  - type: dropdown
    id: status
    attributes:
      label: "Курс или статус"
      options:
        - "1 курс (бакалавриат или специалитет)"
        - "2 курс (бакалавриат или специалитет)"
        - "3 курс (бакалавриат или специалитет)"
        - "4 курс (бакалавриат или специалитет)"
        - "5 курс (специалитет)"
        - "6 курс (специалитет)"
        - "Магистратура, 1 курс"
        - "Магистратура, 2 курс"
        - "Аспирантура"
        - "Преподаватель МГУ"
        - "Научный или другой сотрудник МГУ"
        - "Выпускник МГУ"
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: "Согласие"
      options:
        - label: "Я учусь или работаю в МГУ либо окончил(а) его и поддерживаю предложение манифеста."
          required: true
        - label: "Я согласен(на) на публикацию имени, факультета, курса и даты подписи в открытом списке подписавших."
          required: true
