# Настройки манифеста. После правки собирать ничего не нужно: сайт и PDF
# пересоберутся автоматически после push в main публичного репозитория.

# Публичный репозиторий, в котором живёт манифест, — «владелец/имя».
# Когда сборка идёт в GitHub Actions, берётся репозиторий, в котором она идёт.
github_repo = "NeuroWorknotNeo/msu-ai-manifesto"

# Адрес сайта. Пусто — https://<владелец>.github.io/<имя>/
site_url = ""

# Ссылка на Яндекс Форму (или другую форму) для подписи без GitHub.
# Пусто — на сайте и в PDF останется только подпись через GitHub.
form_url = ""

# Редакция текста. Если правите текст после начала сбора подписей,
# увеличьте номер и поменяйте дату: подписавшие должны видеть, что текст менялся.
edition = "1.0"
edition_date = "2026-09-23"

# Организатор сбора подписей и способ связаться с ним — например, имя и
# фамилия, e-mail или Telegram. Нужны для страницы согласия на публикацию
# подписи (кто обрабатывает данные и куда писать, чтобы отозвать подпись).
# Заполните до запуска: пока поля пусты, сборка предупреждает об этом.
organizer = ""
contact = ""
