# Факультеты и статусы подписавших.
#
# Из этого файла строятся форма подписи на GitHub, проверка подписей и список
# в PDF и на сайте. name — полное название (так оно хранится в signatures.csv
# и показывается в форме), short — краткое название для списка подписей,
# aliases — другие написания, которые распознаются при импорте из формы.
#
# После правки выполните
#     python3 tools/build.py issue-form
# чтобы обновить форму .github/ISSUE_TEMPLATE/podpis.yml.

